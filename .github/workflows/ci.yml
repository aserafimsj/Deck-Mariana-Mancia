name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17 # mesma versão principal do Supabase
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Testes unitários
        run: pnpm test
      - name: Testes de banco (migrations + RLS)
        run: pnpm test:db
      - name: Build
        run: pnpm build
      - name: Instalar navegador
        run: pnpm exec playwright install --with-deps chromium
      - name: Banco para os testes ponta a ponta
        run: pnpm db:e2e
      - name: Testes ponta a ponta (inclui partida com 3 navegadores)
        run: pnpm test:e2e
        env:
          E2E_DB_URL: postgres://postgres:postgres@localhost:5432/scragbadum_e2e
